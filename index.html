<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');
:root{--ink:#09090d;--paper:#e8dfd1;--muted:#9c928a;--red:#d34b58;--violet:#b266f2;--green:#a4e36a;--gold:#e7bd77}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:'DM Mono',monospace}button{font:inherit;color:inherit;cursor:pointer}#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#101014}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

:translate(-50%,-10px);font:500 16px Cinzel,serif;letter-spacing:1px;color:#f2d8be;text-shadow:0 0 18px #ee5366;opacity:0;transition:.3s;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
#overlay{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(13,10,17,.67),rgba(4,4,8,.93));padding:20px}.panel{width:min(760px,94vw);max-height:92dvh;overflow:auto;background:linear-gradient(145deg,rgba(25,21,28,.97),rgba(11,10,15,.98));border:1px solid #d5b17d55;box-shadow:0 25px 100px #000b,inset 0 0 45px #a4421a0b;padding:clamp(22px,5vw,48px);position:relative}.panel:before,.panel:after{content:'';position:absolute;width:18px;height:18px;border-color:#d4ad72;opacity:.7}.panel:before{left:8px;top:8px;border-left:1px solid;border-top:1px solid}.panel:after{right:8px;bottom:8px;border-right:1px solid;border-bottom:1px solid}.eyebrow{font-size:10px;color:#d09d72;letter-spacing:3px;text-transform:uppercase}.title{font:700 clamp(32px,7vw,62px)/1.08 Cinzel,serif;letter-spacing:1px;margin:12px 0 10px;text-shadow:0 0 24px #a3445333}.title span{color:#c34d65}.subtitle{color:#b4a69a;line-height:1.7;font-size:12px;max-width:570px}.rule{height:1px;background:linear-gradient(90deg,#c59e693f,#c59e6900);margin:22px 0}.btn{border:1px solid #cd9c65;background:linear-gradient(100deg,#623238,#3a242d);padding:13px 22px;color:#f1ddc2;font:600 12px Cinzel,serif;letter-spacing:1.5px;transition:.2s}.btn:hover{filter:brightness(1.3);transform:translateY(-1px);box-shadow:0 0 25px #c6465833}.btn.secondary{background:#ffffff08;border-color:#ffffff30;color:#c7bbb0}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.keygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.keyitem{padding:10px;background:#ffffff06;border:1px solid #ffffff13;font-size:10px;color:#aca197;line-height:1.65}.keyitem b{color:#e8d4b8}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.choice{background:#fff00004;border:1px solid #ffffff24;padding:17px 15px;min-height:150px;transition:.2s}.choice:hover{border-color:#cf8bdc;transform:translateY(-2px);background:#8c4cab11}.choice h3{margin:8px 0;font:600 15px Cinzel,serif}.choice p{font-size:10px;color:#b8aaa0;line-height:1.6;margin:0}.choice .tag{font-size:9px;letter-spacing:1.3px;color:#cc8299}.meta{color:#eac67f;font-size:11px}.mapnodes{display:flex;justify-content:space-around;align-items:center;margin:26px 0;padding:20px 5px;background:#09090c;border:1px solid #ffffff17}.node{width:80px;text-align:center}.node i{display:grid;place-items:center;margin:auto;width:36px;height:36px;border-radius:50%;border:1px solid #8e6e8c;color:#c78ed4;background:#281a2c;font-style:normal;font-size:14px;box-shadow:0 0 15px #8e45aa33}.node.active i{border-color:#e9bd7a;color:#ffe1a0;box-shadow:0 0 22px #df9b4866}.node small{font-size:8px;color:#a99b91;display:block;margin-top:8px}.mapline{height:1px;background:#a583a288;flex:1;margin-top:-20px}.small{font-size:10px;color:#9f9389;line-height:1.7}.hidden{display:none!important}
#mobile{display:none;position:absolute;z-index:3;inset:0;pointer-events:none}.pad{position:absolute;left:20px;bottom:22px;display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);gap:4px;pointer-events:auto}.touch{border:1px solid #ffffff3d;background:#17141ba8;color:#dfd3c8;border-radius:8px;touch-action:none}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.actions{position:absolute;right:20px;bottom:24px;display:flex;gap:9px;align-items:end;pointer-events:auto}.actions button{width:52px;height:52px;border-radius:50%;background:#29191fe0;border:1px solid #c75c6d99;font-size:10px}.actions .dash{width:44px;height:44px;background:#21182c;border-color:#a464d4}
@media(max-width:700px){#hud{padding:13px}.brand{font-size:12px}.brand small{font-size:8px}.stats{gap:5px}.chip{padding:7px;font-size:9px}.healthbox{left:13px;top:63px;width:43vw}.slots{left:13px;bottom:116px;gap:4px}.slot{width:auto;min-width:76px;padding:7px}.slot strong{font-size:10px}.slot span{font-size:8px}.objective{right:13px;bottom:95px;font-size:8px}.hint{bottom:83px;font-size:8px}.choices{grid-template-columns:1fr;gap:8px}.choice{min-height:0;padding:11px}.choice h3{display:inline;margin-right:8px}.choice p{display:inline}.keygrid{grid-template-columns:1fr 1fr}.actions button{width:46px;height:46px}#mobile{display:block}}

<body><main id="game"><canvas id="scene"></canvas><div id="vignette"></div>
<div id="hud"><div class="topline"><div class="brand">R U N E B L I G H T<small>ALTARS OF THE ABYSS</small></div><div class="stats"><div class="chip">SOUL ASH <b id="ash">0</b></div><div class="chip">FLOOR <b id="floor">I</b></div><div class="chip">KILLS <b id="kills">0</b></div></div></div>
<div class="healthbox"><div class="healthlabel"><span>VITALITY</span><span id="hptext">100 / 100</span></div><div class="bar"><i id="hpbar" style="width:100%"></i></div><div class="momentum"><i id="momentum" style="width:0%"></i></div></div>
<div class="slots"><div class="slot"><span>ARMS <em>1</em></span><strong id="armSlot">Fleshbound</strong></div><div class="slot"><span>LEGS <em>2</em></span><strong id="legSlot">Gravewalk</strong></div><div class="slot"><span>TORSO <em>3</em></span><strong id="torsoSlot">Hollow</strong></div></div><div class="hint" id="hint">WASD move · SPACE attack · SHIFT dash · E interact</div><div class="objective" id="objective"><b>SUBMERGED CATHEDRALS</b><br>Silence the altar</div><div class="toast" id="toast"></div></div>
<div id="mobile"><div class="pad"><button class="touch up" data-key="w">▲</button><button class="touch left" data-key="a">◀</button><button class="touch down" data-key="s">▼</button><button class="touch right" data-key="d">▶</button></div><div class="actions"><button data-action="attack">ATTACK</button><button class="dash" data-action="dash">DASH</button><button data-action="interact">ALTAR</button></div></div>
<div id="overlay"></div></main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),hud=document.querySelector('#hud');
let W=0,H=0,dpr=1,last=0,now=0;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const BIOMES=[{name:'SUBMERGED CATHEDRALS',ground:'#17191c',accent:'#46a9a0',hazard:'Smoke Veil',desc:'Dark water drinks the light. Stay in the glow.'},{name:'PIT OF WAX & BONES',ground:'#201718',accent:'#e5a84f',hazard:'Wax Pools',desc:'The golden mire clings—dash to break free.'},{name:'THE STONE WOMB',ground:'#211719',accent:'#b64158',hazard:'Vein Eruption',desc:'The walls are alive. Watch the pulsing veins.'}];
const RUNES={arms:[{name:'Blood Scythe',type:'ARMS · CARNAL RUNE',desc:'Sweeping crescent cleaves all nearby foes. Costs 5 HP per strike.',color:'#ed526a',id:'scythe'},{name:'Grave Bolt',type:'ARMS · CARNAL RUNE',desc:'Hurl a necrotic shard at the nearest enemy. The dead pay the cost.',color:'#9b72e9',id:'bolt'},{name:'Hollow Talons',type:'ARMS · CARNAL RUNE',desc:'Fast, wide claw strikes. Each hit siphons a little life.',color:'#9cda6d',id:'talons'}],legs:[{name:'Parasite Step',type:'LEGS · CARNAL RUNE',desc:'Dash through enemies to steal 10 HP from each one.',color:'#e85368',id:'parasite'},{name:'Waxen Glide',type:'LEGS · CARNAL RUNE',desc:'Longer dash; ignore sticky ground and leave burning wax.',color:'#f0b858',id:'glide'},{name:'Wraith Stride',type:'LEGS · CARNAL RUNE',desc:'A second dash charge. Vanish longer between steps.',color:'#aa76ec',id:'wraith'}],torso:[{name:'Shadow Echo',type:'TORSO · CARNAL RUNE',desc:'Dash leaves a clone that repeats your last attack for free.',color:'#ad75ec',id:'echo'},{name:'Iron Husk',type:'TORSO · CARNAL RUNE',desc:'Gain 35 max HP. Your movement is permanently slower.',color:'#87a7a0',id:'husk'},{name:'Blood Lantern',type:'TORSO · CARNAL RUNE',desc:'Reveal a wider area; maximum vitality reduced by 15.',color:'#e56858',id:'lantern'}]};
let mode='title',room={x:0,y:0,w:1100,h:780},player={x:550,y:390,r:15,hp:100,max:100,speed:225,faceX:1,faceY:0,attack:0,dash:0,dashCd:0,ifr:0,combo:0,comboTime:0,damageFlash:0,slots:{arms:null,legs:null,torso:null}},enemies=[],particles=[],hazards=[],echoes=[],keys={},run={floor:1,kills:0,ash:0,perma:+localStorage.getItem('rbBlood')||0,slots:{arms:null,legs:null,torso:null},roomKills:0,rooms:0,weapon:0,upgradeHp:+localStorage.getItem('rbHp')||0,upgradeRune:localStorage.getItem('rbRune')==='1'},lastAttack={x:1,y:0,time:0},dark=0,shake=0,altar={x:550,y:120,active:true},mapStage=0,selectedBiome=0,audio=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),biome=()=>BIOMES[(run.floor-1)%3];
function sound(freq=110,dur=.1,type='sawtooth',vol=.025){try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*.45),audio.currentTime+dur);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function toast(msg){let el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1700)}
function resetRoom(){player.x=550;player.y=520;player.hp=player.max;enemies=[];particles=[];hazards=[];echoes=[];run.roomKills=0;altar={x:550,y:140,active:false};let count=4+Math.min(5,run.floor);for(let i=0;i<count;i++)spawnEnemy();if(run.floor%2===0){for(let i=0;i<4;i++)hazards.push({x:rand(250,850),y:rand(200,600),r:rand(38,70),phase:rand(0,6),type:run.floor%3===0?'vein':'pool'})}}
function startRun(){run.floor=1;run.kills=0;run.ash=0;run.rooms=0;run.slots={arms:null,legs:null,torso:null};player.slots={arms:null,legs:null,torso:null};player.max=100+run.upgradeHp*10;player.hp=player.max;player.speed=225;mode='play';hud.style.display='block';overlay.classList.add('hidden');resetRoom();if(run.upgradeRune){let slot=['arms','legs','torso'][Math.floor(Math.random()*3)],runes=RUNES[slot];carve(slot,runes[Math.floor(Math.random()*runes.length)])}syncHud()}
function spawnEnemy(){let edge=Math.floor(Math.random()*4),x=edge===0?rand(200,900):edge===1?rand(200,900):edge===2?150:950,y=edge===0?130:edge===1?650:rand(150,650);enemies.push({x,y,r:rand(13,19),hp:2+Math.floor(run.floor*.5),max:2+Math.floor(run.floor*.5),speed:rand(48,75)+run.floor*2,hit:0,attack:rand(.4,1.8),type:Math.random()<.25?'brute':'wretch',phase:rand(0,6),dead:false})}
function setMode(m){mode=m;overlay.classList.toggle('hidden',m==='play');hud.style.display=m==='play'?'block':'none';if(m==='play')syncHud()}
function panel(content){overlay.innerHTML=`<section class="panel">${content}</section>`;overlay.classList.remove('hidden')}
function title(){setMode('title');panel(`<div class="eyebrow">A gothic action roguelike</div><h1 class="title">RUNE<span>BLIGHT</span></h1><div class="eyebrow" style="letter-spacing:5px">ALTARS OF THE ABYSS</div><p class="subtitle">Beneath the shattered sanctuary, the altars hunger. Carve forbidden runes into your own flesh. Take their power. Pay in blood.</p><div class="rule"></div><div class="meta">PETRIFIED BLOOD &nbsp;◆&nbsp; ${run.perma}</div><div class="row"><button class="btn" id="begin">DESCEND INTO THE ABYSS</button><button class="btn secondary" id="sanctuary">SHATTERED SANCTUARY</button></div><div class="keygrid"><div class="keyitem"><b>WASD / ARROWS</b><br>Move through the gloom</div><div class="keyitem"><b>SPACE / CLICK</b><br>Strike with your rune</div><div class="keyitem"><b>SHIFT / RIGHT CLICK</b><br>Dash · brief invulnerability</div></div><p class="small">Death claims every rune and Soul Ash. Petrified Blood endures. Choose your scars wisely.</p>`);document.querySelector('#begin').onclick=startRun;document.querySelector('#sanctuary').onclick=sanctuary}
function sanctuary(){setMode('sanctuary');let cost1=20+run.upgradeHp*15,cost2=50;panel(`<div class="eyebrow">The Shattered Sanctuary · above the pit</div><h2 class="title" style="font-size:36px">A little more <span>flesh.</span></h2><p class="subtitle">Spend Petrified Blood to temper the vessel. These gifts endure beyond death.</p><div class="meta" style="margin-top:18px">YOUR PETRIFIED BLOOD &nbsp;◆&nbsp; ${run.perma}</div><div class="choices"><div class="choice"><div class="tag">PERMANENT · VITALITY</div><h3>Thicker Veins</h3><p>+10 starting max HP each purchase.</p><button class="btn" data-up="hp" style="margin-top:13px">${cost1} BLOOD</button></div><div class="choice"><div class="tag">PERMANENT · ARMAMENT</div><h3>Second Carving</h3><p>Begin each run with a rune already carved.</p><button class="btn" data-up="slot" ${run.upgradeRune?'disabled':''} style="margin-top:13px">${run.upgradeRune?'PURCHASED':`${cost2} BLOOD`}</button></div><div class="choice"><div class="tag">THE NEXT DESCENT</div><h3>Return Below</h3><p>New run. Fresh flesh. Same abyss.</p><button class="btn secondary" id="return" style="margin-top:13px">BEGIN ANEW</button></div></div><button class="btn secondary" id="back">BACK</button>`);document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{if(b.dataset.up==='hp'&&run.perma>=cost1){run.perma-=cost1;run.upgradeHp++;localStorage.setItem('rbBlood',run.perma);localStorage.setItem('rbHp',run.upgradeHp);sanctuary()}else if(b.dataset.up==='slot'&&!run.upgradeRune&&run.perma>=cost2){run.perma-=cost2;run.upgradeRune=true;localStorage.setItem('rbBlood',run.perma);localStorage.setItem('rbRune','1');sanctuary()}else toast('Not enough Petrified Blood.')});document.querySelector('#return').onclick=startRun;document.querySelector('#back').onclick=title}
title();
function doAttack(){if(mode!=='play'||player.attack>0)return;player.combo=Math.min(12,player.combo+1);player.attack=(player.slots.arms?.id==='scythe'?.48:player.slots.arms?.id==='talons'?.22:.34)/(1+player.combo*.035);player.comboTime=2.2;lastAttack={x:player.faceX,y:player.faceY,time:now};let rune=player.slots.arms?.id||'flesh';if(rune==='scythe'&&player.hp<=5){toast('Not enough blood to carve.');return}if(rune==='scythe')player.hp-=5;if(rune==='talons')player.hp=Math.min(player.max,player.hp+1);let range=rune==='scythe'?100:rune==='talons'?75:64,angle=Math.atan2(player.faceY,player.faceX),hit=0;
 if(rune==='bolt'){let target=enemies.filter(e=>!e.dead).sort((a,b)=>dist(player,a)-dist(player,b))[0];if(target&&dist(player,target)<400){target.hp-=2+Math.floor(player.combo/6);target.hit=.2;burst(target.x,target.y,'#9b72e9',12);hit=1}else{for(let a=0;a<3;a++)particles.push({x:player.x,y:player.y,vx:Math.cos(angle)*380,vy:Math.sin(angle)*380,life:.36,max:.36,color:'#a77aea',r:4,bolt:true})}}
 else enemies.forEach(e=>{let dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy),diff=Math.atan2(dy,dx)-angle;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;if(d<range+e.r&&Math.abs(diff)<(rune==='scythe'?1.5:1.0)){e.hp-=rune==='scythe'?3:1+(player.combo>5?1:0);e.hit=.24;hit++;burst(e.x,e.y,rune==='scythe'?'#f05a70':'#d7c6ba',5)}});
 if(hit){player.combo=Math.min(12,player.combo);player.comboTime=2.5;sound(rune==='scythe'?75:125,.11,'sawtooth',.045)}else sound(170,.07,'triangle',.02);syncHud()}
function dash(){if(mode!=='play'||player.dashCd>0)return;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(!dx&&!dy){dx=player.faceX;dy=player.faceY}let n=Math.hypot(dx,dy)||1;player.dash=.2;player.ifr=player.slots.legs?.id==='wraith'?.37:.25;player.dashCd=player.slots.legs?.id==='wraith'?.65:1.05;player.dx=dx/n;player.dy=dy/n;player.dashV=player.slots.legs?.id==='glide'?780:690;player.comboTime=Math.max(player.comboTime,1.7);sound(85,.18,'triangle',.05);for(let i=0;i<12;i++)burst(player.x+rand(-9,9),player.y+rand(-10,10),'#a76cd2',1);if(player.slots.torso?.id==='echo')echoes.push({x:player.x,y:player.y,life:.65,done:false});if(player.slots.legs?.id==='parasite')enemies.forEach(e=>{if(!e.dead&&dist(e,{x:player.x+player.dx*50,y:player.y+player.dy*50})<e.r+28){e.hp-=1;player.hp=Math.min(player.max,player.hp+10);burst(e.x,e.y,'#ed526a',8)}});player.x=clamp(player.x+player.dx*48,room.x+42,room.w-42);player.y=clamp(player.y+player.dy*48,room.y+42,room.h-42)}
function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),v=rand(30,180),life=rand(.22,.62);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life,max:life,color,r:rand(1,4)})}}
function hurt(amount){if(player.ifr>0)return;player.hp-=amount;player.damageFlash=.35;player.combo=0;player.comboTime=0;shake=9;sound(55,.24,'square',.05);if(player.hp<=0)die()}
function die(){run.perma+=Math.max(4,Math.floor(run.kills*1.6)+run.floor*2);localStorage.setItem('rbBlood',run.perma);mode='death';hud.style.display='none';panel(`<div class="eyebrow">The abyss has claimed another vessel</div><h2 class="title">Flesh <span>unmade.</span></h2><p class="subtitle">Your carved runes and ${run.ash} Soul Ash are lost to the dark. Your blood remembers.</p><div class="meta" style="margin:20px 0">PETRIFIED BLOOD RECOVERED &nbsp;◆&nbsp; ${run.perma}</div><p class="small">You reached floor ${run.floor} · felled ${run.kills} creatures.</p><div class="row"><button class="btn" id="again">DESCEND AGAIN</button><button class="btn secondary" id="sanct">SHATTERED SANCTUARY</button></div>`);document.querySelector('#again').onclick=startRun;document.querySelector('#sanct').onclick=sanctuary}
function chooseRune(){let slot=['arms','legs','torso'][Math.floor(Math.random()*3)],offers=[...RUNES[slot]].sort(()=>Math.random()-.5).slice(0,3);mode='rune';setMode('rune');panel(`<div class="eyebrow">The altar opens · carve a rune into your ${slot}</div><h2 class="title" style="font-size:36px">Choose your <span>scar.</span></h2><p class="subtitle">Power is never free. Your flesh remembers every bargain.</p><div class="choices">${offers.map((r,i)=>`<div class="choice" data-choice="${i}"><div class="tag" style="color:${r.color}">${r.type}</div><h3>${r.name}</h3><p>${r.desc}</p></div>`).join('')}</div><div class="small">CONTROLS: WASD Move · Space Attack · Shift Dash · E interact</div>`);overlay.querySelectorAll('[data-choice]').forEach((el,i)=>el.onclick=()=>{carve(slot,offers[i]);mapScreen()})}
function carve(slot,r){let old=player.slots[slot];if(old?.id===r.id)return;if(old?.id==='scythe')player.max+=10;if(old?.id==='husk'){player.max-=35;player.speed/=.85}if(old?.id==='lantern')player.max+=15;if(r.id==='husk'){player.max+=35;player.hp+=35;player.speed*=.85}if(r.id==='lantern')player.max-=15;if(r.id==='scythe')player.max-=10;player.slots[slot]=r;player.hp=Math.min(player.hp,player.max);toast(`${r.name} carved into ${slot}.`);syncHud()}
function mapScreen(){mode='map';setMode('map');let b=BIOMES[(run.floor-1)%3];panel(`<div class="eyebrow">THE FRACTURED VITRAL · FLOOR ${run.floor} CLEARED</div><h2 class="title" style="font-size:35px">Choose the <span>next path.</span></h2><p class="subtitle">Glass branches through the abyss. Each descent reveals another altar.</p><div class="mapnodes"><div class="node"><i>✦</i><small>SHATTERED<br>SANCTUARY</small></div><div class="mapline"></div><div class="node active"><i>☠</i><small>${b.name.split(' ')[0]}<br>ALTAR</small></div><div class="mapline"></div><div class="node"><i>◇</i><small>UNKNOWN<br>SIGIL</small></div><div class="mapline"></div><div class="node"><i>✧</i><small>THE DEEP<br>BELOW</small></div></div><div class="choices"><div class="choice" id="path1"><div class="tag">LEFT BRANCH · COMBAT</div><h3>Blood-tithe chamber</h3><p>More enemies · +25 Soul Ash</p></div><div class="choice" id="path2"><div class="tag">RIGHT BRANCH · SHRINE</div><h3>Whispering reliquary</h3><p>Recover 20 vitality · face the altar</p></div></div><button class="btn secondary" id="continue">DESCEND TO FLOOR ${run.floor+1}</button>`);let next=()=>{run.floor++;run.rooms++;run.ash+=15;run.kills+=run.roomKills;player.hp=Math.min(player.max,player.hp+10);resetRoom();mode='play';setMode('play');toast(`FLOOR ${run.floor} · ${biome().name}`)};document.querySelector('#path1').onclick=()=>{run.ash+=25;next();spawnEnemy()};document.querySelector('#path2').onclick=()=>{player.hp=Math.min(player.max,player.hp+20);next()};document.querySelector('#continue').onclick=next}
function altarInteract(){if(!altar.active)return;altar.active=false;run.kills+=run.roomKills;run.roomKills=0;run.ash+=18+run.floor*4;mode='altar';setMode('altar');panel(`<div class="eyebrow">ALTAR OF ${biome().name}</div><h2 class="title" style="font-size:38px">The altar <span>hungers.</span></h2><p class="subtitle">A black stone dais drinks the light. The air speaks in the voices of your dead.</p><div class="meta" style="margin:18px 0">SOUL ASH GATHERED &nbsp;◆&nbsp; ${run.ash}</div><div class="row"><button class="btn" id="carve">CARVE A BODY RUNE</button><button class="btn secondary" id="leave">LEAVE THE ALTAR</button></div><p class="small">Carving replaces the rune in that body slot. The cost is permanent for this run.</p>`);document.querySelector('#carve').onclick=chooseRune;document.querySelector('#leave').onclick=mapScreen}
function syncHud(){document.querySelector('#hptext').textContent=`${Math.max(0,Math.ceil(player.hp))} / ${player.max}`;document.querySelector('#hpbar').style.width=`${clamp(player.hp/player.max*100,0,100)}%`;document.querySelector('#momentum').style.width=`${player.combo/12*100}%`;document.querySelector('#ash').textContent=run.ash;document.querySelector('#floor').textContent=['I','II','III','IV','V','VI','VII','VIII','IX'][Math.min(8,run.floor-1)]||run.floor;document.querySelector('#kills').textContent=run.kills+run.roomKills;document.querySelector('#armSlot').textContent=player.slots.arms?.name||'Fleshbound';document.querySelector('#legSlot').textContent=player.slots.legs?.name||'Gravewalk';document.querySelector('#torsoSlot').textContent=player.slots.torso?.name||'Hollow';document.querySelector('#objective').innerHTML=`<b>${biome().name}</b><br>${enemies.length?'Silence the altar':altar.active?'Approach the altar · E':'The altar is quiet'}`}
function update(dt){now+=dt;if(mode!=='play')return;player.attack=Math.max(0,player.attack-dt);player.dash=Math.max(0,player.dash-dt);player.dashCd=Math.max(0,player.dashCd-dt);player.ifr=Math.max(0,player.ifr-dt);player.damageFlash=Math.max(0,player.damageFlash-dt);player.comboTime-=dt;if(player.comboTime<=0){player.combo=0;player.comboTime=0}let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),n=Math.hypot(dx,dy)||1;if(dx||dy){player.faceX=dx/n;player.faceY=dy/n}let speed=player.speed*(player.combo>3?1+player.combo*.018:1);if(player.dash>0){dx=player.dx;dy=player.dy;speed=player.dashV}else if(dx&&dy){dx/=n;dy/=n}
 speed*=player.slow||1;player.x=clamp(player.x+dx*speed*dt,room.x+42,room.w-42);player.y=clamp(player.y+dy*speed*dt,room.y+42,room.h-42);
 if(keys.space||keys[' ']){if(!keys._atk){doAttack();keys._atk=true}}else keys._atk=false;
 if(keys.e){keys.e=false;if(altar.active&&dist(player,altar)<105)altarInteract()}
 enemies.forEach(e=>{if(e.dead)return;e.hit=Math.max(0,e.hit-dt);e.attack-=dt;let d=dist(e,player),ex=(player.x-e.x)/(d||1),ey=(player.y-e.y)/(d||1);if(d>e.r+player.r+7){e.x+=ex*e.speed*dt;e.y+=ey*e.speed*dt}if(d<e.r+player.r+11&&e.attack<=0){hurt(e.type==='brute'?13:8);e.attack=e.type==='brute'?1.5:1.1}if(e.hp<=0){e.dead=true;run.roomKills++;run.ash+=2;burst(e.x,e.y,'#c84b58',17);sound(65,.18,'square',.025)}});enemies=enemies.filter(e=>!e.dead);
 particles.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;if(p.bolt){enemies.forEach(e=>{if(!e.dead&&dist(p,e)<e.r+8){e.hp--;e.hit=.2;p.life=0;burst(e.x,e.y,'#a77aea',7)}})}});particles=particles.filter(p=>p.life>0);
 echoes.forEach(e=>{e.life-=dt;if(!e.done){e.done=true;let a=Math.atan2(lastAttack.y,lastAttack.x);enemies.forEach(t=>{if(!t.dead&&dist(t,e)<100){t.hp-=1;t.hit=.2;burst(t.x,t.y,'#bb84ed',5)}})}});echoes=echoes.filter(e=>e.life>0);
 hazards.forEach(h=>{h.phase+=dt;if(h.type==='pool'&&dist(h,player)<h.r&&!player.dash)player.slow=.5;else if(h.type==='vein'&&Math.sin(h.phase*2)>0.88&&dist(h,player)<h.r)hurt(12*dt)});if(!hazards.some(h=>h.type==='pool'&&dist(h,player)<h.r))player.slow=1;player.slow??=1;if(player.slow===.5&&player.dash>0)player.slow=1;
 dark=Math.max(0,Math.sin(now*.33+run.floor)*.16);if(biome().name==='SUBMERGED CATHEDRALS'&&Math.random()<.018){hazards.push({x:rand(230,870),y:rand(190,610),r:rand(48,85),life:7,type:'smoke'});hazards=hazards.filter(h=>h.type!=='smoke'||(h.life-=dt)>0)}let smoked=hazards.some(h=>h.type==='smoke'&&dist(h,player)<h.r);if(smoked){dark=Math.max(dark,.68);if(player.ifr<=0&&Math.random()<dt*.55)hurt(4*dt)}
 if(enemies.length===0&&!altar.active){altar.active=true;toast('The altar stirs. Approach it.');sound(180,.5,'sine',.04)}if(shake>0)shake=Math.max(0,shake-dt*30);if(Math.random()<dt*2)particles.push({x:rand(0,room.w),y:room.h,r:rand(1,2),vx:rand(-5,5),vy:-rand(10,30),life:2,max:2,color:'#8b776a'});syncHud()}
function draw(){// render the isometric cathedral chamber
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);let camX=player.x-W/2,camY=player.y-H/2,shakeX=rand(-shake,shake),shakeY=rand(-shake,shake);ctx.save();ctx.translate(-camX+shakeX,H/2-player.y*.84+shakeY);ctx.scale(1,.84);ctx.fillStyle='#08090c';ctx.fillRect(0,0,room.w,room.h);let b=biome();ctx.fillStyle=b.ground;ctx.fillRect(30,30,room.w-60,room.h-60);
 // worn stone tessellation
 for(let y=48;y<room.h-45;y+=54)for(let x=48;x<room.w-45;x+=62){let v=Math.sin(x*12.98+y*4.14);ctx.fillStyle=v>.28?'#ffffff06':v<-.65?'#00000012':'#ffffff03';ctx.fillRect(x,y,60,52);ctx.strokeStyle='#c8b7a414';ctx.lineWidth=1;ctx.strokeRect(x,y,60,52)}
 // outer cathedral walls and broken arches
 ctx.strokeStyle='#4b4140';ctx.lineWidth=24;ctx.strokeRect(32,32,room.w-64,room.h-64);ctx.strokeStyle='#9e8c7733';ctx.lineWidth=2;ctx.strokeRect(46,46,room.w-92,room.h-92);
 for(let x=125;x<room.w-100;x+=220){drawColumn(x,70);drawColumn(x,room.h-70)}for(let y=200;y<room.h-100;y+=220){drawColumn(70,y);drawColumn(room.w-70,y)}
 // central nave sigil
 ctx.save();ctx.translate(room.w/2,room.h/2);ctx.rotate(now*.06);ctx.strokeStyle=b.accent+'35';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,94,0,Math.PI*2);ctx.stroke();for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.beginPath();ctx.moveTo(0,-75);ctx.lineTo(0,-105);ctx.stroke()}ctx.restore();
 hazards.forEach(h=>{if(h.type==='pool'){ctx.fillStyle='#d2923b30';ctx.beginPath();ctx.ellipse(h.x,h.y,h.r,h.r*.58,0,0,7);ctx.fill();ctx.strokeStyle='#e7ae5540';ctx.stroke()}else if(h.type==='vein'){let pulse=.5+.5*Math.sin(h.phase*2);ctx.strokeStyle=`rgba(218,58,77,${.25+pulse*.45})`;ctx.lineWidth=7+pulse*5;ctx.beginPath();ctx.moveTo(h.x-h.r,h.y);ctx.bezierCurveTo(h.x-20,h.y-h.r,h.x+25,h.y+h.r,h.x+h.r,h.y);ctx.stroke()}else{ctx.fillStyle='#21222d99';ctx.beginPath();ctx.arc(h.x,h.y,h.r*(.84+.16*Math.sin(now*2)),0,7);ctx.fill()}});
 // altar glow and stone
 let ag=ctx.createRadialGradient(altar.x,altar.y,2,altar.x,altar.y,130);ag.addColorStop(0,altar.active?'#d1536680':'#66536655');ag.addColorStop(1,'#00000000');ctx.fillStyle=ag;ctx.fillRect(altar.x-140,altar.y-140,280,280);ctx.fillStyle='#403139';ctx.beginPath();ctx.ellipse(altar.x,altar.y+9,60,29,0,0,7);ctx.fill();ctx.fillStyle='#1b1721';ctx.beginPath();ctx.moveTo(altar.x-31,altar.y);ctx.lineTo(altar.x-20,altar.y-33);ctx.lineTo(altar.x,altar.y-40);ctx.lineTo(altar.x+22,altar.y-32);ctx.lineTo(altar.x+32,altar.y);ctx.closePath();ctx.fill();ctx.strokeStyle=altar.active?'#e26f82':'#867287';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=altar.active?'#ff8b9b':'#9a82a8';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=15;ctx.beginPath();ctx.arc(altar.x,altar.y-18,5,0,7);ctx.fill();ctx.shadowBlur=0;
 enemies.forEach(e=>drawEnemy(e));echoes.forEach(e=>{ctx.globalAlpha=e.life/.65*.55;drawHero(e.x,e.y,true);ctx.globalAlpha=1});particles.forEach(p=>{ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=7;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.shadowBlur=0});ctx.globalAlpha=1;drawHero(player.x,player.y,false);
 // point lights rendered in world-space
 ctx.globalCompositeOperation='screen';let light=ctx.createRadialGradient(player.x,player.y,20,player.x,player.y,player.slots.torso?.id==='lantern'?340:230);light.addColorStop(0,'#a879a82b');light.addColorStop(.55,b.accent+'10');light.addColorStop(1,'#00000000');ctx.fillStyle=light;ctx.fillRect(player.x-360,player.y-360,720,720);ctx.globalCompositeOperation='source-over';ctx.restore();
 // screen darkness, player lantern punches a soft hole
 if(dark>.05){ctx.fillStyle=`rgba(3,4,10,${dark})`;ctx.fillRect(0,0,W,H)}
 // dash cooldown ring and altar pointer
 if(mode==='play'&&altar.active){let ax=W/2+(altar.x-player.x),ay=H/2+(altar.y-player.y)*.84;if(ax<25||ax>W-25||ay<25||ay>H-25){ctx.fillStyle='#edb575';ctx.font='20px serif';ctx.textAlign='center';ctx.fillText('◆',clamp(ax,25,W-25),clamp(ay,38,H-25))}}
 if(player.damageFlash>0){ctx.fillStyle=`rgba(180,35,48,${player.damageFlash*.28})`;ctx.fillRect(0,0,W,H)} }
// Ancient columns frame the nave.
function drawColumn(x,y){ctx.fillStyle='#302b2b';ctx.beginPath();ctx.ellipse(x,y+8,20,13,0,0,7);ctx.fill();ctx.fillStyle='#59504b';ctx.fillRect(x-13,y-17,26,24);ctx.fillStyle='#72645a';ctx.fillRect(x-17,y-21,34,6);ctx.fillStyle='#17171b';ctx.fillRect(x-9,y-14,4,16)}
function drawHero(x,y,ghost){let facing=Math.atan2(player.faceY,player.faceX),c=player.slots.arms?.color||'#c7b9aa';ctx.save();ctx.translate(x,y);ctx.scale(1,1.08);ctx.fillStyle=ghost?'#a878d0':'#050507';ctx.beginPath();ctx.ellipse(0,10,17,8,0,0,7);ctx.fill();ctx.fillStyle=ghost?'#9c71c4':player.damageFlash?'#ff9294':'#92847a';ctx.beginPath();ctx.ellipse(0,0,12,16,0,0,7);ctx.fill();ctx.fillStyle='#d4c3b0';ctx.beginPath();ctx.arc(0,-12,9,0,7);ctx.fill();ctx.fillStyle='#30252a';ctx.fillRect(-6,-18,12,4);ctx.fillStyle='#f16b79';ctx.shadowColor='#ef556b';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(Math.cos(facing)*5,-12+Math.sin(facing)*2,2,0,7);ctx.fill();ctx.shadowBlur=0;if(player.attack>0&&!ghost){ctx.strokeStyle=c;ctx.globalAlpha=.6;ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,-2,56,facing-.95,facing+.95);ctx.stroke();ctx.globalAlpha=1}if(player.ifr>0&&!ghost){ctx.strokeStyle='#b981e7aa';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,24,28,0,0,7);ctx.stroke()}ctx.restore()}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle='#050507';ctx.beginPath();ctx.ellipse(0,11,e.r+3,7,0,0,7);ctx.fill();let col=e.type==='brute'?'#6d3540':'#727d69';ctx.fillStyle=e.hit?'#f3d9d4':col;ctx.beginPath();ctx.ellipse(0,0,e.r,e.r*1.12,0,0,7);ctx.fill();ctx.fillStyle='#30262a';ctx.beginPath();ctx.arc(0,-e.r*.48,e.r*.53,0,7);ctx.fill();ctx.fillStyle='#f04c56';ctx.shadowColor='#f04c56';ctx.shadowBlur=9;ctx.fillRect(-e.r*.5,-e.r*.52,3,2);ctx.fillRect(e.r*.2,-e.r*.52,3,2);ctx.shadowBlur=0;if(e.hp<e.max){ctx.fillStyle='#160f13';ctx.fillRect(-e.r,-e.r-9,e.r*2,3);ctx.fillStyle='#dc5965';ctx.fillRect(-e.r,-e.r-9,e.r*2*e.hp/e.max,3)}ctx.restore()}
function pause(){if(mode!=='play')return;mode='pause';setMode('pause');panel(`<div class="eyebrow">A moment in the dark</div><h2 class="title">The abyss <span>waits.</span></h2><p class="subtitle">Your descent is held in place. The creatures are patient.</p><div class="row"><button class="btn" id="resume">RETURN TO BATTLE</button><button class="btn secondary" id="quit">ABANDON THIS RUN</button></div>`);document.querySelector('#resume').onclick=()=>{mode='play';setMode('play')};document.querySelector('#quit').onclick=title}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys[k]=true;if(k==='shift')dash();if(k==='escape')pause();if(k===' '||k==='spacebar')doAttack();if(k==='e'){keys.e=true}});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});canvas.addEventListener('pointerdown',e=>{if(e.button===0)doAttack();if(e.button===2)dash()});canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('.touch').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();b.dataset.action==='attack'?doAttack():b.dataset.action==='dash'?dash():altarInteract()}));
function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
